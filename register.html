<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Lora:ital,wght@1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--paper:#f6f4ef;--card:#fff;--ink:#181a1f;--ink2:#6b6b6b;--line:#e6e2d9;--accent:#2f6bff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Onest,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:460px;width:100%;padding:34px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:26px;margin:6px 0 2px;text-wrap:balance}
.meta{color:var(--ink2);font-size:14px;margin-bottom:22px}
label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px}
input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.note{font-size:12.5px;color:var(--ink2);margin-top:14px;text-align:center}
.big{text-align:center;padding:14px 0}
.big .em{font-size:44px}
.err{color:#c0392b;font-size:13px;margin-top:10px}
.brand{text-align:center;color:var(--ink2);font-size:12px;margin-top:20px}
.quote{font-family:Lora,serif;font-style:italic;color:var(--ink2);font-size:14.5px;margin:0 0 20px}
</style>
</head>
<body>
<div class="card" id="card"><div class="big"><div class="em">&#9203;</div><p>Loading…</p></div></div>
<script src="config.js"></script>
<script>
(function(){
  var sb = window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY);
  var token = new URLSearchParams(location.search).get("e");
  var card = document.getElementById("card");
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function fail(msg){ card.innerHTML = '<div class="big"><div class="em">&#128577;</div><h1>'+esc(msg)+'</h1></div><div class="brand">Powered by Orbit</div>'; }
  if(!token){ fail("This link is missing its event code."); return; }
  sb.rpc("event_public_info",{p_token:token}).then(function(r){
    if(r.error || !r.data || !r.data.length){ fail("We couldn't find this event."); return; }
    var ev = r.data[0];
    if(!ev.registration_open){ card.innerHTML='<div class="eyebrow">'+esc(ev.event_type||"Event")+'</div><h1>'+esc(ev.name)+'</h1><div class="big"><div class="em">&#128274;</div><p>Registration is not open yet. Please check back later.</p></div><div class="brand">Powered by Orbit</div>'; return; }
    render(ev);
  });
  function render(ev){
    var meta = [ev.event_date, ev.venue].filter(Boolean).join(" &middot; ");
    card.innerHTML =
      '<div class="eyebrow">You&rsquo;re invited to register</div>'+
      '<h1>'+esc(ev.name)+'</h1>'+
      '<div class="meta">'+meta+'</div>'+
      '<div class="row"><div><label>First name</label><input id="f-first"></div><div><label>Family name</label><input id="f-family"></div></div>'+
      '<label>Email</label><input id="f-email" type="email" inputmode="email">'+
      '<label>Phone</label><input id="f-phone" inputmode="tel">'+
      '<div class="row"><div><label>Which side? <span style="font-weight:400;color:var(--ink2)">(optional)</span></label><input id="f-side" placeholder="e.g. Bride / Groom"></div><div><label>Group <span style="font-weight:400;color:var(--ink2)">(optional)</span></label><input id="f-cat" placeholder="e.g. Friends"></div></div>'+
      '<label>Guests coming with you</label><input id="f-plus" type="number" min="0" value="0">'+
      '<div class="err" id="f-err"></div>'+
      '<button id="f-go">Register</button>'+
      '<div class="brand">Powered by Orbit</div>';
    document.getElementById("f-go").onclick = submit;
  }
  function submit(){
    var g=function(id){var e=document.getElementById(id);return e?e.value.trim():"";};
    if(!g("f-first") && !g("f-family")){ document.getElementById("f-err").textContent="Please enter your name."; return; }
    var btn=document.getElementById("f-go"); btn.disabled=true; btn.textContent="Registering…";
    sb.rpc("event_register",{p_token:token,p_first:g("f-first"),p_family:g("f-family"),p_email:g("f-email"),p_phone:g("f-phone"),p_side:g("f-side"),p_category:g("f-cat"),p_plus:parseInt(g("f-plus"),10)||0}).then(function(r){
      if(r.error){ document.getElementById("f-err").textContent="Something went wrong: "+r.error.message; btn.disabled=false; btn.textContent="Register"; return; }
      card.innerHTML='<div class="big"><div class="em">&#127881;</div><h1>You&rsquo;re on the list!</h1><p class="meta">Thank you for registering. The hosts will be in touch with the details.</p></div><div class="brand">Powered by Orbit</div>';
    });
  }
})();
</script>
</body>
</html>
